[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biweekly-budget"
version = "0.1.0"
description = "Personal biweekly pay-cycle leftover and category-breakdown calculator"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2",
    "flask-limiter>=3.5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]
deploy = [
    "boto3[crt]>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budget = ["templates/*", "static/*", "schema.sql"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Flask-Login and Flask-WTF ship no type stubs; `deprecated` (pulled in by Flask-Limiter)
# uses Python 3.12 syntax that mypy rejects under python_version = "3.11".
[[tool.mypy.overrides]]
module = ["flask_login", "flask_wtf", "flask_wtf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deprecated", "deprecated.*"]
follow_imports = "skip"
