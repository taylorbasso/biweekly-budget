<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biweekly Budget{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  <nav>
    <a href="/">Leftover</a>
    <a href="/pay-schedule">Pay Schedule</a>
    <a href="/expenses">Expenses</a>
    <a href="/annual-cost">Annual Cost</a>
    <a href="/runway">Runway</a>
    <a href="/credit-cards">Credit Cards</a>
    <form class="signout" method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span class="signed-in-as">{{ current_user.email }}</span>
      <button type="submit">Sign out</button>
    </form>
  </nav>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
