{% extends "layout.html" %}
{% set editing = action != "/runway/accounts" %}
{% block title %}{{ "Edit" if editing else "Add" }} Account — Biweekly Budget{% endblock %}
{% block content %}
<h1>{{ "Edit" if editing else "Add" }} Account</h1>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ action }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>
    Name
    <input type="text" name="name" placeholder="e.g. Savings" value="{{ values.name }}" required>
  </label>
  <label>
    Balance
    <span class="input-prefix">
      <span aria-hidden="true">$</span>
      <input type="number" step="0.01" min="0" inputmode="decimal" name="balance"
             value="{{ values.balance }}" required>
    </span>
  </label>
  <label>
    Early-withdrawal penalty / tax (%)
    <span class="hint">Share you'd lose by cashing it out now, e.g. 10–30% for a 401(k). Leave 0 for cash.</span>
    <input type="number" min="0" max="100" inputmode="numeric" name="penalty_tax_percent"
           value="{{ values.penalty_tax_percent }}">
  </label>
  <div class="form-actions">
    <button type="submit">{{ "Save changes" if editing else "Add account" }}</button>
    <a href="/runway">Cancel</a>
  </div>
</form>
{% endblock %}
