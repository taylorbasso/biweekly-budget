{% extends "layout.html" %}
{% block title %}{{ "Edit" if account else "Add" }} Credit Card / Loan — Biweekly Budget{% endblock %}
{% block content %}
<h1>{{ "Edit" if account else "Add" }} Credit Card / Loan</h1>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="{{ action }}">
  <label>
    Name
    <input type="text" name="name" value="{{ account.name if account else '' }}" required>
  </label>
  <label>
    Balance (dollars)
    <input type="number" step="0.01" min="0" name="balance"
           value="{{ '%.2f'|format(account.balance / 100) if account else '' }}" required>
  </label>
  <label>
    Interest Rate (annual %, e.g. 24.99)
    <input type="number" step="0.01" min="0" name="interest_rate"
           value="{{ account.interest_rate if account else 0 }}">
  </label>
  <label>
    Minimum Payment (dollars)
    <input type="number" step="0.01" min="0" name="minimum_payment"
           value="{{ '%.2f'|format(account.minimum_payment / 100) if account else '' }}">
  </label>
  <label>
    Actual Payment (dollars, optional — falls back to minimum payment if left at 0)
    <input type="number" step="0.01" min="0" name="actual_payment"
           value="{{ '%.2f'|format(account.actual_payment / 100) if account else '' }}">
  </label>
  <label>
    Credit Limit (dollars, optional — leave at 0 if not tracking usage %)
    <input type="number" step="0.01" min="0" name="credit_limit"
           value="{{ '%.2f'|format(account.credit_limit / 100) if account else '' }}">
  </label>
  <button type="submit">Save</button>
</form>
{% endblock %}
